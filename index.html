<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎉 عجلة اليوم الوطني مع Stride</title>
  <meta name="theme-color" content="#1a7f3b" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root{--bg:#0b1a12;--card:#0f2419;--text:#ecfdf5;--brand:#1a7f3b;--brand2:#23a455;--gold:#f5d38e}
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,Segoe UI,Arial;direction:rtl;color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:
        radial-gradient(1200px 800px at 80% -10%,rgba(35,164,85,.20),transparent 60%),
        radial-gradient(900px 700px at 0% 110%,rgba(13,95,47,.30),transparent 60%),
        linear-gradient(180deg,#0a1a11,#0b1a12 40%,#08160f);
    }
    .wrap{width:100%;max-width:1100px;display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:960px){.wrap{grid-template-columns:520px 1fr;align-items:start}}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px;
      backdrop-filter:blur(6px);box-shadow:0 20px 40px rgba(0,0,0,.35)
    }
    .title{margin:0 0 12px;text-align:center;font-weight:900;font-size:26px;color:#eafff1}
    label{display:block;margin:8px 0 6px;color:#d1fae5;font-weight:700}
    input{
      width:100%;padding:12px 14px;border-radius:10px;background:#0c1f16;color:var(--text);
      border:1px solid rgba(255,255,255,.12);font-size:15px
    }
    input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(35,164,85,.18);outline:0}
    .row{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:10px}
    button{
      width:100%;padding:12px 14px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-size:16px;
      background:linear-gradient(90deg,var(--brand),var(--brand2));color:#04140b;transition:transform .06s ease,filter .2s
    }
    button:hover{filter:brightness(1.05)} button:active{transform:scale(.98)}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .note{margin-top:10px;color:#ffd7a6;min-height:22px}
    canvas{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}

    /* نافذة الفوز */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
    .modal.show{display:flex}
    .modal .box{background:#10271c;border:1px solid rgba(255,255,255,.12);border-radius:16px;max-width:420px;width:100%;padding:22px;text-align:center}
    .modal h3{margin:0 0 10px}
    .close{background:#0c1f16;border:1px solid rgba(255,255,255,.18);color:#e8fff3}
  </style>
</head>
<body>
  <main class="wrap">
    <!-- لوحة التسجيل -->
    <section class="card">
      <h2 class="title">سجّل بياناتك ثم لفّ العجلة</h2>

      <label for="name">الاسم</label>
      <input id="name" type="text" placeholder="مثال: محمد علي" autocomplete="name" />

      <label for="phone">رقم الجوال</label>
      <input id="phone" type="tel" placeholder="05xxxxxxxx" inputmode="tel" maxlength="10" autocomplete="tel" />

      <div class="row">
        <button id="registerBtn">✅ تسجيل البيانات</button>
        <button id="spinBtn" disabled>🎯 لف العجلة</button>
      </div>

      <div id="note" class="note"></div>
    </section>

    <!-- لوحة العجلة -->
    <section class="card">
      <h2 class="title">🎉 عجلة اليوم الوطني مع Stride</h2>
      <canvas id="wheel" width="520" height="520" aria-label="عجلة الحظ"></canvas>
    </section>
  </main>

  <!-- نافذة فوز -->
  <div class="modal" id="winModal" role="dialog" aria-modal="true">
    <div class="box">
      <h3 id="winTitle">مبروك! 🎉</h3>
      <p id="winText"></p>
      <button class="close" id="closeWin">حسناً</button>
    </div>
  </div>

  <script>
    // 🔗 ضع هنا آخر رابط Web App لديك (لو تغيّر بدّله)
    const GAS = "https://script.google.com/macros/s/AKfycbxzBKHWOiOU4V_4_5h_fFq-O4YpQuXDTQ15O5RX1eDQLfCmTrlSL4MMRPA0LGcmkWGzXA/exec";

    // ✳️ وضع صارم أم مرن؟
    // HARD_FAIL=false: فعّل زر اللف محليًا حتى لو السيرفر فشل (عشان ما تتعطل).
    // HARD_FAIL=true : ممنوع اللف إلا لو السيرفر رجّع ok:true.
    const HARD_FAIL = false;

    const PRIZES = [
      { label:'خصم 5٪',  color:'#1a7f3b' },
      { label:'خصم 10٪', color:'#23a455' },
      { label:'خصم 15٪', color:'#0ea5e9' },
      { label:'خصم 20٪', color:'#2dd4bf' },
      { label:'خصم 25٪', color:'#22c55e' },
      { label:'خصم 30٪', color:'#86efac' }
    ];

    // عناصر DOM
    const nameEl  = document.getElementById('name');
    const phoneEl = document.getElementById('phone');
    const regBtn  = document.getElementById('registerBtn');
    const spinBtn = document.getElementById('spinBtn');
    const note    = document.getElementById('note');
    const modal   = document.getElementById('winModal');
    const winText = document.getElementById('winText');
    const closeWin= document.getElementById('closeWin');

    // Canvas
    const canvas = document.getElementById('wheel');
    const ctx    = canvas.getContext('2d');
    const R      = canvas.width/2;
    let angle    = -Math.PI/2, spinning=false;

    // رسم العجلة
    function drawWheel(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.save(); ctx.translate(R,R);
      const n=PRIZES.length, arc=(2*Math.PI)/n;

      for(let i=0;i<n;i++){
        const start=angle + i*arc, end=start+arc;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-14,start,end); ctx.closePath();
        ctx.fillStyle=PRIZES[i].color; ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; ctx.stroke();

        const mid=start+arc/2;
        ctx.save(); ctx.rotate(mid);
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#082216';
        ctx.font='700 20px system-ui,Arial';
        ctx.fillText(PRIZES[i].label, R*0.68, 0);
        ctx.restore();
      }
      // مركز وسهم
      ctx.beginPath(); ctx.arc(0,0,62,0,Math.PI*2); ctx.fillStyle='#0c1f16'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=3; ctx.stroke();
      ctx.restore();
      // سهم المؤشر بالأعلى
      ctx.beginPath(); ctx.moveTo(R-12,14); ctx.lineTo(R+12,14); ctx.lineTo(R,48); ctx.closePath();
      ctx.fillStyle='#f5d38e'; ctx.fill();
      ctx.strokeStyle='#0b1a12'; ctx.lineWidth=2; ctx.stroke();
    }
    drawWheel();

    // دوران للقطاع المستهدف
    function spinTo(index, done){
      if(spinning) return; spinning=true;
      const n=PRIZES.length, arc=(2*Math.PI)/n;
      // استهداف منتصف القطاع تحت السهم مباشرةً
      const midTarget = -Math.PI/2 - (index*arc + arc/2);
      const extraTurns = 5 + Math.floor(Math.random()*2); // 5~6 لفات
      const target = midTarget - extraTurns*2*Math.PI;
      const start  = angle, dur = 4500 + Math.random()*600, t0=performance.now();
      const ease = t => 1 - Math.pow(1-t,3);

      (function anim(now){
        const t = Math.min(1,(now - t0)/dur);
        angle = start + (target - start) * ease(t);
        drawWheel();
        if(t<1) requestAnimationFrame(anim); else { spinning=false; done && done(); }
      })(performance.now());
    }

    // طلب API مع مهلة وفشل آمن
    async function api(route, payload){
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 6000); // 6 ثواني مهلة
      try{
        const r = await fetch(GAS, {
          method:'POST',
          body: JSON.stringify({route, ...payload}),
          signal: controller.signal
        });
        clearTimeout(timer);
        if(!r.ok) return {ok:false};
        return await r.json();
      }catch(err){
        console.warn('API error:', err);
        clearTimeout(timer);
        return {ok:false};
      }
    }

    // زر التسجيل
    regBtn.addEventListener('click', async ()=>{
      const name = nameEl.value.trim();
      const phone= phoneEl.value.trim().replace(/\D/g,'').slice(0,10);
      phoneEl.value = phone;

      if(!name || phone.length!==10){
        note.textContent='أدخل الاسم ورقم جوال 10 أرقام.';
        if(!HARD_FAIL){ spinBtn.disabled=false; note.textContent += ' (تم تفعيل اللف محليًا)'; }
        return;
      }

      regBtn.disabled=true;
      const res = await api('register',{name,phone});
      regBtn.disabled=false;

      if(res && res.ok){
        spinBtn.disabled=false;
        note.textContent='تم التسجيل ✅ يمكنك الآن لفّ العجلة.';
      }else{
        if(HARD_FAIL){
          spinBtn.disabled=true;
          note.textContent='تعذّر التسجيل (السيرفر).';
        }else{
          spinBtn.disabled=false;
          note.textContent='تعذّر التسجيل (السيرفر) — تم تفعيل اللف محليًا ✅';
        }
      }
    });

    // زر لف العجلة
    spinBtn.addEventListener('click', async ()=>{
      const name = nameEl.value.trim();
      const phone= phoneEl.value.trim().replace(/\D/g,'').slice(0,10);
      if(!name || phone.length!==10){
        note.textContent='أدخل الاسم ورقم جوال 10 أرقام أولاً.';
        return;
      }

      spinBtn.disabled=true;

      // نحاول السيرفر أولاً
      let res = await api('spin',{name,phone});
      let index;

      if(res && res.ok && typeof res.index === 'number'){
        index = res.index % PRIZES.length;
      }else if(res && res.ok && res.prize){
        index = Math.max(0, PRIZES.findIndex(p=>p.label===res.prize));
        if(index<0) index = Math.floor(Math.random()*PRIZES.length);
      }else{
        // فشل السيرفر → اختيار محلي
        index = Math.floor(Math.random()*PRIZES.length);
        if(HARD_FAIL){
          note.textContent='غير مسموح بالمحاولة الآن (السيرفر).';
          spinBtn.disabled=false; 
          return;
        }else{
          note.textContent='تمت المحاولة محليًا (Fallback).';
        }
      }

      // دوران ثم احتفال
      spinTo(index, ()=>{
        for(let i=0;i<5;i++){
          setTimeout(()=>confetti({particleCount:140, spread:70, origin:{y:0.6}}), i*250);
        }
        document.getElementById('winText').textContent = `مبروك! جائزتك: ${PRIZES[index].label}`;
        modal.classList.add('show');
        spinBtn.disabled=false;
      });
    });

    // إغلاق نافذة الفوز
    document.getElementById('closeWin').addEventListener('click', ()=> modal.classList.remove('show'));

    // إدخال الهاتف: أرقام فقط
    phoneEl.addEventListener('input', ()=>{ phoneEl.value = phoneEl.value.replace(/\D/g,'').slice(0,10); });
  </script>
</body>
</html>
