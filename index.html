<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 عجلة اليوم الوطني مع Stride</title>
  <style>
    body {
      font-family: "Tajawal", Arial, sans-serif;
      background: linear-gradient(135deg, #013220, #006400);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    canvas {
      border: 10px solid #fff;
      border-radius: 50%;
      background: #0f3d2e;
    }
    .panel {
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    button {
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #28a745;
      color: white;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #218838;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div class="panel">
      <h1>🇸🇦 عجلة اليوم الوطني مع Stride</h1>
      <label>الاسم</label>
      <input type="text" id="name" placeholder="ادخل اسمك">
      <label>رقم الجوال</label>
      <input type="text" id="phone" placeholder="05XXXXXXXX">
      <button onclick="register()">تسجيل البيانات</button>
      <button onclick="spin()">لف العجلة</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script>
    const prizes = ["خصم 5%", "خصم 10%", "خصم 15%", "خصم 20%", "خصم 25%", "خصم 30%"];
    const colors = ["#1aaf5d", "#2ecc71", "#27ae60", "#16a085", "#0e6655", "#145a32"];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    let angle = 0;

    function drawWheel() {
      const arc = (2 * Math.PI) / prizes.length;
      prizes.forEach((prize, i) => {
        const startAngle = angle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(150, 150);
        ctx.arc(150, 150, 150, startAngle, startAngle + arc);
        ctx.fill();
        ctx.save();
        ctx.translate(150, 150);
        ctx.rotate(startAngle + arc / 2);
        ctx.fillStyle = "white";
        ctx.font = "bold 16px Tajawal";
        ctx.textAlign = "right";
        ctx.fillText(prize, 140, 10);
        ctx.restore();
      });
    }

    drawWheel();

    function spin() {
      const spins = Math.floor(Math.random() * 5) + 5;
      const finalAngle = Math.random() * 2 * Math.PI;
      const totalAngle = spins * 2 * Math.PI + finalAngle;
      const duration = 4000;
      const start = performance.now();

      function animate(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        angle = totalAngle * progress;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawWheel();
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          const arc = (2 * Math.PI) / prizes.length;
          const index = Math.floor(((2 * Math.PI) - (angle % (2 * Math.PI))) / arc) % prizes.length;
          document.getElementById("result").innerText = "🎉 النتيجة: " + prizes[index];
          saveResult(prizes[index]);
        }
      }
      requestAnimationFrame(animate);
    }

    function register() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      if (!name || !phone) {
        alert("❌ الرجاء إدخال الاسم ورقم الجوال");
        return;
      }
      alert("✅ تم تسجيل بياناتك بنجاح، يمكنك الآن لف العجلة!");
    }

    function saveResult(prize) {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      if (!name || !phone) return;

      fetch("https://script.google.com/macros/s/AKfycbzkvH2Rp9aYBh9UUaqAviZfcZP8kcpL6Uh4o-Y4ufUKlLXHF5oh9n70H_zwgbxB0Yq6yg/exec", {
        method: "POST",
        body: JSON.stringify({ name, phone, prize }),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.text())
      .then(data => console.log("Saved:", data))
      .catch(err => console.error("Error:", err));
    }
  </script>
</body>
</html>
