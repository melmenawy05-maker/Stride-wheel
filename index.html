<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>🎉 عجلة اليوم الوطني مع Stride</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    body{font-family:Arial, sans-serif;text-align:center;background:#0b1a12;color:#fff;margin:0;padding:20px}
    .card{background:#123;padding:20px;margin:20px auto;border-radius:10px;max-width:400px}
    input,button{padding:10px;margin:5px;border-radius:6px}
    button{cursor:pointer;background:#23a455;color:#fff;border:none}
    button:disabled{opacity:.5;cursor:not-allowed}
    canvas{margin-top:20px}
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 عجلة اليوم الوطني مع Stride</h2>
    <label>الاسم</label><br>
    <input id="name" placeholder="الاسم"><br>
    <label>رقم الجوال</label><br>
    <input id="phone" placeholder="05xxxxxxxx" maxlength="10"><br>
    <button id="registerBtn">تسجيل البيانات ✅</button>
    <button id="spinBtn" disabled>لف العجلة 🎯</button>
    <p id="msg"></p>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>

  <script>
    const GAS="https://script.google.com/macros/s/AKfycbyQoAIXbpt1GaPbv5KVhjbmt6g9ZxBw6WafpGeMm33z9dI0RSGsgeb--b2JNcmtDs2syQ/exec";

    const wheel=document.getElementById('wheel'), ctx=wheel.getContext('2d');
    const prizes=['خصم 5٪','خصم 10٪','خصم 15٪','خصم 20٪','خصم 25٪','خصم 30٪'];
    const registerBtn=document.getElementById('registerBtn');
    const spinBtn=document.getElementById('spinBtn');
    const msg=document.getElementById('msg');
    const nameInput=document.getElementById('name');
    const phoneInput=document.getElementById('phone');
    let currentAngle=0, spinning=false;

    function draw(){
      ctx.clearRect(0,0,300,300);
      const arc=2*Math.PI/prizes.length;
      for(let i=0;i<prizes.length;i++){
        ctx.beginPath();ctx.moveTo(150,150);
        ctx.arc(150,150,140,currentAngle+i*arc,currentAngle+(i+1)*arc);
        ctx.fillStyle=i%2?"#23a455":"#1a7f3b";ctx.fill();
        ctx.save();ctx.translate(150,150);ctx.rotate(currentAngle+(i+0.5)*arc);
        ctx.fillStyle="#fff";ctx.font="bold 14px Arial";
        ctx.fillText(prizes[i],60,0);ctx.restore();
      }
    }
    draw();

    async function api(route,data){
      try{
        let r=await fetch(GAS,{method:'POST',body:JSON.stringify({route,...data})});
        return await r.json();
      }catch(err){
        console.error(err);
        return {ok:false};
      }
    }

    registerBtn.onclick=async()=>{
      const name=nameInput.value.trim(), phone=phoneInput.value.trim();
      if(!name||!phone){msg.textContent="أكمل البيانات";return;}
      let res=await api('register',{name,phone});
      if(res.ok){msg.textContent="تم التسجيل ✅";spinBtn.disabled=false;}
      else msg.textContent="تعذر التسجيل";
    };

    spinBtn.onclick=async()=>{
      if(spinning) return;
      let res=await api('spin',{name:nameInput.value,phone:phoneInput.value});
      if(!res.ok){msg.textContent="لا يمكنك اللعب الآن";return;}
      const index=res.index, arc=2*Math.PI/prizes.length;
      const target=-index*arc-Math.PI/2+Math.PI*6;
      const start=currentAngle, duration=4000, t0=performance.now();
      spinning=true;
      (function anim(t){
        let p=Math.min((t-t0)/duration,1);
        currentAngle=start+(target-start)*(1-Math.pow(1-p,3));
        draw();
        if(p<1) requestAnimationFrame(anim); else{
          spinning=false;
          confetti();
          msg.textContent="🎉 مبروك! "+prizes[index];
        }
      })(performance.now());
    };
  </script>
</body>
</html>
