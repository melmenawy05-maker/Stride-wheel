<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎉 عجلة اليوم الوطني مع Stride</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    body {margin:0;font-family:Arial,system-ui;background:#0b1a12;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card{background:#10271c;padding:20px;border-radius:12px;max-width:600px;width:100%;text-align:center}
    canvas{max-width:400px;width:100%}
    input,button{margin:6px 0;padding:10px;width:100%;border-radius:6px;border:none;font-size:16px}
    button{background:#23a455;color:#fff;cursor:pointer}
    button[disabled]{opacity:.5;cursor:not-allowed}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
    .modal.show{display:flex}
    .box{background:#fff;color:#000;padding:20px;border-radius:8px;max-width:300px}
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 عجلة اليوم الوطني مع Stride</h2>
    <canvas id="wheel" width="400" height="400"></canvas>
    <input id="name" placeholder="الاسم" />
    <input id="phone" placeholder="05xxxxxxxx" maxlength="10" />
    <button id="registerBtn">✅ تسجيل البيانات</button>
    <button id="spinBtn" disabled>🎯 لف العجلة</button>
    <div id="note"></div>
  </div>

  <div class="modal" id="winModal">
    <div class="box">
      <h3>مبروك 🎉</h3>
      <p id="winText"></p>
      <button onclick="document.getElementById('winModal').classList.remove('show')">إغلاق</button>
    </div>
  </div>

<script>
  // 🔗 لينك الـ exec بتاعك
  const GAS = "https://script.google.com/macros/s/AKfycbzrCibn1FSL7j89aDWpA3o6wUq-BaWxrko2MloynLZ--10pr3LwGsrqVTYZKTAeIOQ9bA/exec"; 

  const PRIZES = ['خصم 5٪','خصم 10٪','خصم 15٪','خصم 20٪','خصم 25٪','خصم 30٪'];

  const canvas = document.getElementById("wheel"), ctx = canvas.getContext("2d"), R=200;
  let angle=-Math.PI/2, spinning=false;
  function drawWheel(){
    ctx.clearRect(0,0,400,400);ctx.save();ctx.translate(R,R);
    const arc=2*Math.PI/PRIZES.length;
    for(let i=0;i<PRIZES.length;i++){
      const start=angle+i*arc, end=start+arc;
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-10,start,end);ctx.closePath();
      ctx.fillStyle=i%2?"#23a455":"#1a7f3b";ctx.fill();
      const mid=start+arc/2;ctx.save();ctx.rotate(mid);
      ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.textAlign="center";ctx.fillText(PRIZES[i],120,0);
      ctx.restore();
    }
    ctx.restore();
    ctx.fillStyle="gold";ctx.beginPath();ctx.moveTo(190,10);ctx.lineTo(210,10);ctx.lineTo(200,40);ctx.closePath();ctx.fill();
  }
  drawWheel();

  function spinTo(index,done){
    if(spinning)return;spinning=true;
    const arc=2*Math.PI/PRIZES.length;
    const target=-Math.PI/2-(index*arc+arc/2)-5*2*Math.PI;
    const start=angle,dur=4000,t0=performance.now();
    (function anim(t){
      const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      angle=start+(target-start)*e;drawWheel();
      if(p<1)requestAnimationFrame(anim);else{spinning=false;done&&done();}
    })(t0);
  }

  async function api(route,payload){
    try{
      const r=await fetch(GAS,{method:"POST",body:JSON.stringify({route,...payload})});
      return await r.json();
    }catch{return{ok:false};}
  }

  const nameEl=document.getElementById("name"),phoneEl=document.getElementById("phone"),
        regBtn=document.getElementById("registerBtn"),spinBtn=document.getElementById("spinBtn"),
        note=document.getElementById("note"),winText=document.getElementById("winText"),modal=document.getElementById("winModal");

  regBtn.onclick=async()=>{
    if(!nameEl.value.trim()||phoneEl.value.trim().length!==10){note.textContent="أدخل الاسم ورقم 10 أرقام";return;}
    const r=await api("register",{name:nameEl.value,phone:phoneEl.value});
    if(r.ok){note.textContent="تم التسجيل ✅";spinBtn.disabled=false;}
    else{note.textContent="مشكلة في التسجيل، لكن جرب اللف.";spinBtn.disabled=false;}
  };

  spinBtn.onclick=async()=>{
    if(spinning)return;
    const res=await api("spin",{name:nameEl.value,phone:phoneEl.value});
    if(!res||!res.ok||!res.prize){note.textContent="غير مسموح الآن";spinBtn.disabled=false;return;}
    const idx=PRIZES.findIndex(p=>p===res.prize);
    spinTo(idx<0?0:idx,()=>{
      confetti({particleCount:120,spread:70,origin:{y:0.6}});
      winText.textContent="جائزتك: "+res.prize;
      modal.classList.add("show");
    });
  };
</script>
</body>
</html>
