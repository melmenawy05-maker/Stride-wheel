<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎉 عجلة اليوم الوطني مع Stride</title>
  <meta name="theme-color" content="#1a7f3b" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root{--g1:#0d5f2f;--g2:#1a7f3b;--g3:#23a455;--bg:#0b1a12;--card:#0f2419;--text:#ecfdf5;--muted:#b7e4c7;--gold:#f5d38e}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Arial;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
      radial-gradient(1200px 800px at 80% -10%,rgba(35,164,85,.20),transparent 60%),
      radial-gradient(900px 700px at 0% 110%,rgba(13,95,47,.30),transparent 60%),
      linear-gradient(180deg,#0a1a11,#0b1a12 40%,#08160f);}
    .container{width:100%;max-width:1080px;display:grid;gap:18px;grid-template-columns:1fr}
    @media(min-width:960px){.container{grid-template-columns:520px 1fr;align-items:start}}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px;backdrop-filter:blur(6px);box-shadow:0 20px 40px rgba(0,0,0,.35)}
    .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px}
    .brand img{width:140px;height:auto;object-fit:contain}
    .title{font-size:26px;margin:0;font-weight:800;color:#e8fff3;text-align:center}
    label{display:block;margin:10px 0 6px;color:#d1fae5;font-weight:700}
    input{width:100%;padding:12px 14px;border-radius:10px;background:#0c1f16;color:var(--text);border:1px solid rgba(255,255,255,.12);font-size:15px}
    input:focus{border-color:#23a455;box-shadow:0 0 0 4px rgba(35,164,85,.18);outline:0}
    .row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
    button{width:100%;padding:12px 14px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-size:16px;background:linear-gradient(90deg,var(--g2),var(--g3));color:#04140b;transition:transform .06s ease,filter .2s}
    button:hover{filter:brightness(1.05)} button:active{transform:scale(.98)} button[disabled]{opacity:.6;cursor:not-allowed}
    .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
    .chip{border:1px solid rgba(255,255,255,.16);color:#cde9d6;padding:6px 10px;border-radius:999px;font-size:12px}
    canvas{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
    .toast{margin-top:10px;font-size:13px;color:#ffd7a6;display:none}
    .show{display:block}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">
        <!-- غيّر الرابط لو اللوجو بمكان آخر -->
        <img src="https://raw.githubusercontent.com/melmenawy05-maker/Stride-wheel/main/logo.png" alt="STRIDE Logo" />
        <h2 class="title">🎉 عجلة اليوم الوطني مع Stride</h2>
      </div>
      <canvas id="wheel" width="520" height="520"></canvas>
    </section>

    <section class="card">
      <h2 class="title">سجّل بياناتك ثم لفّ العجلة</h2>

      <label for="name">الاسم</label>
      <input id="name" type="text" placeholder="مثال: محمد علي" autocomplete="name"/>

      <label for="phone">رقم الجوال</label>
      <input id="phone" type="tel" placeholder="05xxxxxxxx" inputmode="tel" autocomplete="tel" maxlength="10"/>

      <div class="row" style="margin-top:10px">
        <button id="registerBtn">تسجيل البيانات ✅</button>
        <button id="spinBtn" disabled>لف العجلة 🎯</button>
      </div>

      <div id="toast" class="toast"></div>

      <div class="chips" id="chips"></div>
    </section>
  </main>

  <script>
    //
